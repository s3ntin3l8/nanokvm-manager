name: nanokvm-manager-traefik

# Example FULL STACK: NanoKVM Manager behind a Traefik reverse proxy with
# automatic TLS. Self-contained for someone who does NOT already run Traefik.
#
# Sanitized — before use, replace:
#   - nanokvm.example.com         your dashboard hostname (must resolve to this host)
#   - you@example.com             your ACME email
#   - letsencrypt / websecure     your cert resolver / entrypoint names if different
#
# Run:  docker compose -f compose.traefik.example.yaml up -d
services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=you@example.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy
    restart: unless-stopped

  app:
    image: ghcr.io/s3ntin3l8/nanokvm-manager:latest
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.nanokvm.rule=Host(`nanokvm.example.com`)
      - traefik.http.routers.nanokvm.entrypoints=websecure
      - traefik.http.routers.nanokvm.tls.certresolver=letsencrypt
      - traefik.http.services.nanokvm.loadbalancer.server.port=8080
    restart: unless-stopped

networks:
  proxy:
    driver: bridge
